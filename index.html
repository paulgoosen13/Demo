<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Demo Shop</title>
  <link rel="stylesheet" href="style.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <header>
    <div class="container">
      <h1 class="logo">🛍️ Demo Shop</h1>
      <div class="header-right">
        <span class="cart">Cart: <span id="cart-count">0</span></span>
        <a href="checkout.html" class="checkout-link">Checkout</a>
      </div>
    </div>
  </header>

  <main>
    <section class="hero">
      <div class="container">
        <h2>Trending Tech Deals</h2>
        <p>Upgrade your gear with these hot picks!</p>
      </div>
    </section>

    <div class="container">
      <div class="product-grid">
        <a href="product1.html" class="product-card">
          <img src="speaker1.jpg" alt="Bluetooth Speaker" />
          <h3>Bluetooth Speaker</h3>
          <p class="price">R299.00</p>
        </a>
        <a href="product2.html" class="product-card">
          <img src="headphones1.jpg" alt="Wireless Headphones" />
          <h3>Wireless Headphones</h3>
          <p class="price">R499.00</p>
        </a>
        <a href="product3.html" class="product-card">
          <img src="charger1.jpg" alt="USB-C Charger" />
          <h3>USB-C Charger</h3>
          <p class="price">R199.00</p>
        </a>
      </div>
    </div>
  </main>

  <footer>
    <div class="container">
      <p>&copy; 2025 Demo Shop. All rights reserved.</p>
    </div>
  </footer>

  <script src="script.js"></script>
</body>
</html>
